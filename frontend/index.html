<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="porchsongs" />
  <meta name="theme-color" content="#faf9f6" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1c1917" media="(prefers-color-scheme: dark)" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!--
    media="print" makes this stylesheet non-render-blocking; src/lib/webfonts.ts
    promotes it to media="all" once it has loaded.

    A cross-origin stylesheet in <head> blocks first paint until the request
    settles. Everything else the app needs is precached by the service worker and
    answered in single-digit milliseconds, so on an iOS PWA cold launch (radio
    asleep, cellular reconnecting, or no signal at all) this one request was the
    only thing between the user and a rendered page: nothing painted until it
    timed out. Fonts already carry display=swap, so deferring them changes
    nothing beyond the first frame using the fallback stack.

    The promotion cannot be an inline onload handler: the production CSP is
    `script-src 'self'` with no nonce, which blocks inline event handlers.
  -->
  <link
    data-webfonts
    media="print"
    href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Geist:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <title>porchsongs</title>
</head>
<body>
  <div id="root"></div>
  <noscript>
    <style>.ns-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:system-ui,sans-serif;padding:2rem;text-align:center}.ns-title{font-size:1.5rem;margin-bottom:.5rem}.ns-text{color:#666}</style>
    <div class="ns-wrap">
      <div>
        <h1 class="ns-title">JavaScript Required</h1>
        <p class="ns-text">porchsongs requires JavaScript to run. Please enable it in your browser settings.</p>
      </div>
    </div>
  </noscript>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
