<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a3728" />
      <stop offset="100%" stop-color="#6b4c35" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.4">
      <stop offset="0%" stop-color="#b85c2c" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#b85c2c" stop-opacity="0" />
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="0.8" fill="#faf9f6" opacity="0.06" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)" />
  <rect width="1280" height="640" fill="url(#dots)" />
  <rect width="1280" height="640" fill="url(#glow)" />

  <!-- Decorative horizontal lines (porch railing) -->
  <line x1="0" y1="530" x2="1280" y2="530" stroke="#faf9f6" stroke-opacity="0.06" stroke-width="1" />
  <line x1="0" y1="550" x2="1280" y2="550" stroke="#faf9f6" stroke-opacity="0.04" stroke-width="1" />

  <!-- Scattered music notes (background) -->
  <text x="100" y="130" font-family="serif" font-size="32" fill="#faf9f6" opacity="0.07" transform="rotate(-15 100 130)">&#9835;</text>
  <text x="180" y="520" font-family="serif" font-size="28" fill="#faf9f6" opacity="0.06" transform="rotate(10 180 520)">&#9834;</text>
  <text x="1080" y="100" font-family="serif" font-size="36" fill="#faf9f6" opacity="0.06" transform="rotate(20 1080 100)">&#9834;</text>
  <text x="1160" y="480" font-family="serif" font-size="24" fill="#faf9f6" opacity="0.05" transform="rotate(-10 1160 480)">&#9835;</text>
  <text x="950" y="530" font-family="serif" font-size="30" fill="#faf9f6" opacity="0.05">&#9833;</text>
  <text x="300" y="80" font-family="serif" font-size="22" fill="#faf9f6" opacity="0.05">&#9833;</text>

  <!-- Logo: guitar pick, identical to frontend/public/logo.svg -->
  <g transform="translate(530, 30) scale(2.2)">
    <path d="M50 3 C68 3, 90 16, 94 38 C98 60, 74 88, 50 97 C26 88, 2 60, 6 38 C10 16, 32 3, 50 3 Z" fill="#b85c2c" />
    <path d="M50 8 C66 8, 85 19, 89 39 C93 57, 71 83, 50 91 C29 83, 7 57, 11 39 C15 19, 34 8, 50 8 Z" fill="none" stroke="#9e4e24" stroke-width="1" opacity="0.4" />
    <polygon points="50,24 30,42 70,42" fill="#faf9f6" />
    <rect x="34" y="42" width="32" height="22" rx="1" fill="#faf9f6" />
    <rect x="45" y="50" width="10" height="14" rx="1" fill="#b85c2c" />
    <circle cx="53" cy="58" r="1.2" fill="#faf9f6" />
    <rect x="36" y="46" width="7" height="6" rx="1" fill="#b85c2c" opacity="0.6" />
    <text x="62" y="30" font-family="serif" font-size="14" fill="#faf9f6" opacity="0.9">&#9834;</text>
    <text x="70" y="22" font-family="serif" font-size="10" fill="#faf9f6" opacity="0.7">&#9835;</text>
  </g>

  <!-- Wordmark. Fraunces is --font-display, the same face the app header
       uses for "porchsongs". The previous banner set it in bold Plus Jakarta Sans,
       which is the UI font, so the wordmark did not match the product. -->
  <text x="640" y="330" font-family="'Fraunces', Georgia, serif" font-size="104" font-weight="400" fill="#faf9f6" text-anchor="middle" letter-spacing="-1">porchsongs</text>

  <!-- Accent line -->
  <rect x="529" y="352" width="222" height="3" rx="1.5" fill="#b85c2c" opacity="0.8" />

  <!-- Tagline: the marketing hero sentence verbatim, the same string the app
       header carries. Positioning lives in one place. -->
  <text x="640" y="398" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="28" fill="#faf9f6" text-anchor="middle" opacity="0.7" letter-spacing="1">Your chord charts, ready to play</text>

  <!-- Feature pills. Widths are fitted to the rendered label widths rather than
       hand-guessed, so no label can overflow its pill. Deliberately no offline
       claim: the marketing site still says offline access is being built. -->
  <g font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="16" font-weight="600">
    <rect x="286" y="440" width="132" height="36" rx="18" fill="#b85c2c" opacity="0.25" />
    <rect x="286" y="440" width="132" height="36" rx="18" fill="none" stroke="#b85c2c" stroke-opacity="0.4" stroke-width="1" />
    <text x="352" y="463" fill="#faf9f6" text-anchor="middle" opacity="0.85">Any Format</text>
    <rect x="436" y="440" width="186" height="36" rx="18" fill="#b85c2c" opacity="0.25" />
    <rect x="436" y="440" width="186" height="36" rx="18" fill="none" stroke="#b85c2c" stroke-opacity="0.4" stroke-width="1" />
    <text x="529" y="463" fill="#faf9f6" text-anchor="middle" opacity="0.85">Performance View</text>
    <rect x="640" y="440" width="146" height="36" rx="18" fill="#b85c2c" opacity="0.25" />
    <rect x="640" y="440" width="146" height="36" rx="18" fill="none" stroke="#b85c2c" stroke-opacity="0.4" stroke-width="1" />
    <text x="713" y="463" fill="#faf9f6" text-anchor="middle" opacity="0.85">Built-in Tuner</text>
    <rect x="804" y="440" width="191" height="36" rx="18" fill="#b85c2c" opacity="0.25" />
    <rect x="804" y="440" width="191" height="36" rx="18" fill="none" stroke="#b85c2c" stroke-opacity="0.4" stroke-width="1" />
    <text x="899.5" y="463" fill="#faf9f6" text-anchor="middle" opacity="0.85">Hands-Free Follow</text>
  </g>

  <!-- Bottom text -->
  <text x="640" y="590" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="16" fill="#faf9f6" text-anchor="middle" opacity="0.3" letter-spacing="3">IMPORT, KEEP, AND PLAY YOUR CHORD CHARTS</text>
</svg>
